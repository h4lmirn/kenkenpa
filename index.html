<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="左手の小指から人差し指までを動かす指のトレーニングゲーム。毎日変わる今日の練習つき。">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>4本けんけんぱ！</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 横持ちの1画面アプリ。上に流れてくるマス目、下に4本指の押し枠。マス目の列と押し枠の列は同じグリッドでそろえる */
:root{
  --bg:#E8EBE5; --surface:#F7F8F4; --ink:#1F2328; --muted:#5F676C; --line:#C5CBC2;
  --f5:#5257C2; --f4:#18857B; --f3:#B87C0C; --f2:#C2405F; --onfill:#FFFFFF;
  --ok:#2C8550; --ng:#C23535;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191C20; --surface:#23272D; --ink:#E7E9E4; --muted:#9BA2A7; --line:#3A4048;
  --f5:#8E92F2; --f4:#46C1B4; --f3:#E7AF40; --f2:#EE7594; --onfill:#14171A;
  --ok:#5DC28C; --ng:#F06C6C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191C20; --surface:#23272D; --ink:#E7E9E4; --muted:#9BA2A7; --line:#3A4048;
  --f5:#8E92F2; --f4:#46C1B4; --f3:#E7AF40; --f2:#EE7594; --onfill:#14171A;
  --ok:#5DC28C; --ng:#F06C6C; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
section{flex:1;min-height:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--f5);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- メニュー ---------- */
#menu{overflow-y:auto;padding-block:18px 28px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px 28px;max-width:960px;margin:0 auto}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,36px);line-height:1.2;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:6px 0 0;max-width:34em}
.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.hand div{border-radius:10px;padding:6px 4px;text-align:center;background:var(--c);color:var(--onfill);font-weight:700;font-size:13px;line-height:1.3}
.hand b{display:block;font-family:var(--display);font-size:22px}
.howto{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px;color:var(--ink);font-size:14px}
.howto li{padding-left:1.1em;text-indent:-1.1em}
.howto li::before{content:"・"}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 8px}
.group+.group{margin-top:18px}
.patterns{display:grid;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.opt label span{font-weight:700}
.opt label small{color:var(--muted);font-size:12.5px;text-align:right}
.opt input:checked+label{border-color:var(--ink)}
.opt input:focus-visible+label{outline:3px solid var(--f5);outline-offset:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .opt{flex:1;min-width:0}
.seg .opt label{justify-content:center;padding:8px 10px;text-align:center}
.bpm{display:flex;align-items:center;gap:12px}
.bpm input{flex:1;min-width:0;accent-color:var(--ink)}
.bpm output{font-family:var(--display);font-weight:700;font-size:20px;min-width:4.5em;text-align:right}
.sound{display:flex;align-items:center;gap:8px;font-size:14px}
.sound input{width:18px;height:18px;accent-color:var(--ink)}
.best{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--surface);font-size:13.5px;color:var(--muted)}
.best b{color:var(--ink)}
.daily{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:14px 16px}
.daily-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.daily h2,.free-h{font-family:var(--display);font-weight:900;font-size:20px;margin:0}
.daily-head span{color:var(--muted);font-size:14px}
.daily-text{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.daily-rec{margin:8px 0 0;font-size:14px}
.daily-rec:empty{display:none}
.daily .start{margin-top:12px}
.free-h{margin:24px 0 10px}
.start.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--ink);font-size:17px}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sh{flex:1;min-width:120px;text-align:center;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;text-decoration:none;color:var(--ink)}
.share-text{width:100%;box-sizing:border-box;resize:none;font:inherit;font-size:13.5px;line-height:1.6;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;-webkit-user-select:text;user-select:text}
.start{margin-top:16px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:900;font-size:20px}

/* ---------- プレイ ---------- */
#play{display:flex;flex-direction:column;gap:8px;padding-block:8px}
.hud{display:flex;align-items:center;gap:12px;font-size:14px}
.hud .quit{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.hud .prog{font-family:var(--display);font-weight:700;font-size:16px}
.hud .live{margin-left:auto;color:var(--muted)}
#track{position:relative;flex:1;min-height:0;overflow:hidden}
#track,#zones{width:100%;max-width:400px;margin-inline:auto}
.hit{position:absolute;left:0;right:0;border-top:2px dashed var(--line)}
.row{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;will-change:transform}
.cell{border-radius:10px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:22px;transition:opacity .2s}
.cell.on{background:var(--c);border:2px solid var(--c);color:var(--onfill)}
.row.cur .cell.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c)}
.row.done{opacity:.25}
.row.shake{animation:shake .22s}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
.judge{position:absolute;left:50%;top:6px;translate:-50% 0;font-family:var(--display);font-weight:900;font-size:20px;pointer-events:none;opacity:0;transition:opacity .25s}
.judge.show{opacity:1;transition:none}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:64px;pointer-events:none}
#zones{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;height:44%;min-height:110px}
.zone{position:relative;border-radius:16px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;touch-action:none;transition:background .15s,border-color .15s}
.zone b{font-family:var(--display);font-size:28px;line-height:1;color:var(--c)}
.zone small{font-size:11.5px;color:var(--muted)}
.zone.ok{background:color-mix(in srgb,var(--c) 32%,var(--surface));border-color:var(--c);transition:none}
.zone.ng{background:color-mix(in srgb,var(--ng) 26%,var(--surface));border-color:var(--ng);transition:none}

/* ---------- 結果 ---------- */
#result{overflow-y:auto;padding-block:18px 28px}
.res{max-width:760px;margin:0 auto;display:grid;gap:18px}
.res h2{font-family:var(--display);font-weight:900;font-size:26px;margin:0}
.res .sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fig{background:var(--surface);border-radius:12px;padding:10px 14px}
.fig span{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}
.fig b{font-family:var(--display);font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.fig small{font-size:13px;color:var(--muted);margin-left:2px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 6.5em;align-items:center;gap:10px;font-size:14px}
.bar .track{height:12px;border-radius:6px;background:var(--surface);overflow:hidden}
.bar .fill{height:100%;background:var(--c);border-radius:6px}
.bar .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:14px;margin:0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns button{flex:1;min-width:140px;padding:12px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);font-weight:700}
.btns .primary{background:var(--ink);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.row.shake{animation:none}*{transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <section id="menu">
    <div class="menu-grid">
      <div>
        <h1>4本けんけんぱ！</h1>
        <p class="lede">色つきのマスと同じ列の枠を、その列の指で押します。</p>
        <div class="hand">
          <div style="--c:var(--f5)"><b>5</b>小指</div>
          <div style="--c:var(--f4)"><b>4</b>薬指</div>
          <div style="--c:var(--f3)"><b>3</b>中指</div>
          <div style="--c:var(--f2)"><b>2</b>人差し指</div>
        </div>
        <ul class="howto">
          <li>左手の4本の指を枠の上に構えます。</li>
          <li>押したら指を離します。つけたままだと次の押下を判定できません。</li>
          <li>マスが2つの段（パ）は、2本同時に押します。</li>
        </ul>
      </div>
      <div>
        <div class="daily">
          <div class="daily-head"><h2>今日の練習</h2><span class="num" id="daily-date"></span></div>
          <p class="daily-text">32マス、自分のペース。並びは日本時間の0時に変わり、同じ日ならだれがやっても同じです。</p>
          <p class="daily-rec num" id="daily-rec"></p>
          <button class="start" id="daily-start">今日の練習をはじめる</button>
        </div>
        <h2 class="free-h">自由練習</h2>
        <div class="group">
          <p class="label">練習する並び</p>
          <div class="patterns" id="patterns"></div>
        </div>
        <div class="group">
          <p class="label">進み方</p>
          <div class="seg">
            <div class="opt"><input type="radio" name="mode" id="mode-free" value="free"><label for="mode-free"><span>自分のペース</span></label></div>
            <div class="opt"><input type="radio" name="mode" id="mode-tempo" value="tempo"><label for="mode-tempo"><span>テンポに合わせる</span></label></div>
          </div>
        </div>
        <div class="group" id="bpm-group">
          <p class="label">テンポ</p>
          <div class="bpm"><input type="range" id="bpm" min="40" max="160" step="4"><output id="bpm-out" class="num"></output></div>
        </div>
        <div class="group">
          <p class="label">マスの数</p>
          <div class="seg">
            <div class="opt"><input type="radio" name="len" id="len-16" value="16"><label for="len-16"><span>16</span></label></div>
            <div class="opt"><input type="radio" name="len" id="len-32" value="32"><label for="len-32"><span>32</span></label></div>
            <div class="opt"><input type="radio" name="len" id="len-64" value="64"><label for="len-64"><span>64</span></label></div>
          </div>
        </div>
        <div class="group"><label class="sound"><input type="checkbox" id="sound">メトロノームと効果音を鳴らす</label></div>
        <div class="best" id="best"></div>
        <button class="start ghost" id="start">自由練習をはじめる</button>
      </div>
    </div>
  </section>

  <section id="play" hidden>
    <div class="hud">
      <button class="quit" id="quit">やめる</button>
      <span class="prog num" id="prog"></span>
      <span class="live num" id="live"></span>
    </div>
    <div id="track"><div class="judge" id="judge"></div><div class="count" id="count"></div></div>
    <div id="zones"></div>
  </section>

  <section id="result" hidden>
    <div class="res" id="res"></div>
  </section>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const FINGERS=[5,4,3,2];
const NAME={5:'小指',4:'薬指',3:'中指',2:'人差し指'};
const PAIR_WIN=150;
const SITE_URL='https://kenkenpa.h4lmiran.com/';
const PATTERNS={
  scale:{name:'順番に往復',note:'5→4→3→2→2→3→4→5',rows:[[5],[4],[3],[2],[2],[3],[4],[5]]},
  hanon:{name:'ハノン1番風',note:'親指を使わない 5-4-3-2-3-4',rows:[[5],[4],[3],[2],[3],[4]]},
  weak:{name:'薬指と小指',note:'4と5の交互が中心',rows:[[5],[4],[5],[4],[4],[3],[4],[3],[5],[3],[4],[2]]},
  pairs:{name:'2本ずつ交互',note:'24 と 35 のくり返し',rows:[[4,2],[5,3]]},
  kkp:{name:'ケンケンパ',note:'1本、1本、2本同時',rows:[[4],[3],[5,2],[3],[4],[5,2],[5],[4],[3,2],[2],[3],[5,4]]},
  random:{name:'ランダム',note:'2本同時もまじる',rows:null}
};

const KEY='kkp4-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
let data=load();
let S=Object.assign({pattern:'scale',mode:'free',bpm:72,len:32,sound:true},data.settings||{});
data.best=data.best||{};

/* ---- メニュー ---- */
const pWrap=$('#patterns');
Object.entries(PATTERNS).forEach(([k,p])=>{
  const d=document.createElement('div');d.className='opt';
  d.innerHTML=`<input type="radio" name="pattern" id="pat-${k}" value="${k}"><label for="pat-${k}"><span>${p.name}</span><small>${p.note}</small></label>`;
  pWrap.appendChild(d);
});
function keyOf(c){return c.daily?'daily|'+c.date:c.pattern+'|'+c.mode+(c.mode==='tempo'?'|'+c.bpm:'')}
function bestKey(){return keyOf(S)}
function syncDaily(){
  const d=today();$('#daily-date').textContent=mdOf(d);
  const b=data.best['daily|'+d],dl=data.daily||{};
  const alive=dl.last===d||dl.last===today(-1);
  const streak=alive&&dl.streak>1?`連続 ${dl.streak}日`:'';
  $('#daily-rec').textContent=b?`今日の記録：1マスあたり ${b.avg} ms（正確さ ${b.acc}%）${streak?'、'+streak:''}`:(dl.last===d?`今日は練習済み${streak?'、'+streak:''}`:streak);
}
function syncMenu(){
  document.querySelector(`#pat-${S.pattern}`).checked=true;
  document.querySelector(`#mode-${S.mode}`).checked=true;
  document.querySelector(`#len-${S.len}`).checked=true;
  $('#bpm').value=S.bpm;$('#bpm-out').textContent=S.bpm+' BPM';
  $('#bpm-group').hidden=S.mode!=='tempo';
  $('#sound').checked=S.sound;
  syncDaily();
  const b=data.best[bestKey()];
  const head=`${PATTERNS[S.pattern].name}（${S.mode==='tempo'?S.bpm+' BPM':'自分のペース'}）`;
  if(!b){$('#best').innerHTML=`${head}の記録はまだありません。`;return}
  $('#best').innerHTML=S.mode==='free'
    ? `${head}の自己ベスト：1マスあたり <b class="num">${b.avg} ms</b>（正確さ ${b.acc}%）`
    : `${head}の自己ベスト：ぴったり率 <b class="num">${b.rate}%</b>`;
}
function persist(){data.settings=S;save(data)}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='pattern')S.pattern=t.value;
  else if(t.name==='mode')S.mode=t.value;
  else if(t.name==='len')S.len=+t.value;
  else if(t.id==='sound')S.sound=t.checked;
  else return;
  persist();syncMenu();
});
$('#bpm').addEventListener('input',e=>{S.bpm=+e.target.value;persist();syncMenu()});
syncMenu();

function show(id){['menu','play','result'].forEach(s=>$('#'+s).hidden=s!==id)}

/* ---- 音 ---- */
let ac=null;
function tick(when,accent,soft){
  if(!ac||!S.sound)return;
  try{
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=accent?1500:soft?700:1000;
    const v=soft?0.05:0.14;
    g.gain.setValueAtTime(0.0001,when);g.gain.exponentialRampToValueAtTime(v,when+0.004);g.gain.exponentialRampToValueAtTime(0.0001,when+0.05);
    o.connect(g).connect(ac.destination);o.start(when);o.stop(when+0.06);
  }catch(e){}
}

/* ---- 押し枠 ---- */
const zonesEl=$('#zones');
FINGERS.forEach((f,i)=>{
  const z=document.createElement('div');z.className='zone';z.style.setProperty('--c',`var(--f${f})`);
  z.innerHTML=`<b>${f}</b><small>${NAME[f]}</small>`;
  z.addEventListener('pointerdown',e=>{e.preventDefault();const now=performance.now();const t=(e.timeStamp>0&&Math.abs(now-e.timeStamp)<1000)?e.timeStamp:now;press(i,t)});
  z.addEventListener('contextmenu',e=>e.preventDefault());
  zonesEl.appendChild(z);
});
const zones=[...zonesEl.children];
function flash(l,cls){const z=zones[l];z.classList.remove('ok','ng');void z.offsetWidth;z.classList.add(cls);clearTimeout(z._t);z._t=setTimeout(()=>z.classList.remove(cls),140)}
const KEYMAP={a:0,s:1,d:2,f:3};
document.addEventListener('keydown',e=>{if(e.repeat||$('#play').hidden)return;const l=KEYMAP[e.key.toLowerCase()];if(l!==undefined){e.preventDefault();press(l,performance.now())}});

/* ---- 並びをつくる ---- */
function rngFor(str){let a=0;for(const c of str)a=(a*31+c.charCodeAt(0))>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function today(off=0){return new Date(Date.now()+9*3600e3+off*864e5).toISOString().slice(0,10)}
function mdOf(d){const[,m,dd]=d.split('-');return `${+m}月${+dd}日`}
function genRows(k,len,rnd=Math.random,pp=0.25){
  const out=[];
  if(k==='random'){
    let prev=null;
    while(out.length<len){
      if(rnd()<pp){const i=Math.floor(rnd()*4);let j;do{j=Math.floor(rnd()*4)}while(j===i);out.push([FINGERS[i],FINGERS[j]].sort((x,y)=>y-x));prev=null}
      else{let f;do{f=FINGERS[Math.floor(rnd()*4)]}while(f===prev);out.push([f]);prev=f}
    }
  }else{const p=PATTERNS[k].rows;let i=0;while(out.length<len)out.push(p[i++%p.length].slice())}
  return out;
}

/* ---- ゲーム ---- */
let G=null,raf=0,wl=null;
const track=$('#track');
function start(daily){
  daily=daily===true;
  persist();
  const cfg=daily?{daily:true,date:today(),pattern:'daily',mode:'free',len:32,bpm:S.bpm}:{daily:false,pattern:S.pattern,mode:S.mode,len:S.len,bpm:S.bpm};
  if(S.sound){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){ac=null}}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}
  const rows=daily?genRows('random',32,rngFor('4hon-'+cfg.date),0.3):genRows(cfg.pattern,cfg.len);
  G={cfg,mode:cfg.mode,rows,idx:0,pv:0,pressed:new Map(),firstAt:0,err:{5:0,4:0,3:0,2:0},wrong:0,early:0,times:[],lastT:null,startT:null,judg:{p:0,g:0,z:0,m:0},offs:[],done:false};
  show('play');buildTrack();layout();
  if(G.mode==='tempo'){
    G.iv=60000/S.bpm;G.win=Math.min(180,G.iv*0.45);
    const lead=200;G.t0=performance.now()+lead+4*G.iv;
    if(ac&&S.sound){const a0=ac.currentTime+lead/1000;for(let i=0;i<4+rows.length;i++)tick(a0+i*G.iv/1000,i<4||(i-4)%4===0)}
  }
  hud();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function buildTrack(){
  track.querySelectorAll('.row,.hit').forEach(n=>n.remove());
  const hit=document.createElement('div');hit.className='hit';track.appendChild(hit);G.hitEl=hit;
  G.els=G.rows.map(r=>{
    const row=document.createElement('div');row.className='row';
    FINGERS.forEach(f=>{const c=document.createElement('div');c.className='cell';if(r.includes(f)){c.classList.add('on');c.style.setProperty('--c',`var(--f${f})`);c.textContent=f}row.appendChild(c)});
    track.appendChild(row);return row;
  });
}
function layout(){
  if(!G)return;
  const H=track.clientHeight;
  G.rowH=Math.max(38,Math.min(86,H/3.2));
  G.cellH=G.rowH*0.78;
  G.hitY=H-G.rowH*0.55;
  G.hitEl.style.top=G.hitY+'px';
  G.els.forEach(el=>{el.style.height=G.cellH+'px'});
}
addEventListener('resize',layout);
function hud(){
  $('#prog').textContent=`${Math.min(G.idx,G.rows.length)} / ${G.rows.length}`;
  $('#live').textContent=G.mode==='free'?`ミス ${G.wrong}`:`${S.bpm} BPM　ぴったり ${G.judg.p}`;
  G.els.forEach((el,i)=>el.classList.toggle('cur',i===G.idx));
}
const JLABEL={p:'ぴったり',g:'よい',z:'ずれ',m:'ミス'};
function judge(j,off){
  const el=$('#judge');
  el.textContent=JLABEL[j]+(j!=='m'&&j!=='p'?`（${off<0?'早め':'遅め'}）`:'');
  el.style.color=j==='m'?'var(--ng)':j==='p'?'var(--ok)':'var(--ink)';
  el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),280);
}
function shake(){const el=G.els[G.idx];if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function blameMissing(row){row.forEach(n=>{if(!G.pressed.has(n))G.err[n]++})}
function resolve(){
  G.els[G.idx].classList.add('done');
  G.idx++;G.pressed.clear();hud();
  if(G.idx>=G.rows.length){G.done=true;setTimeout(finish,G.mode==='tempo'?450:250)}
}
function press(l,t){
  if(!G||G.done)return;
  const f=FINGERS[l],row=G.rows[G.idx];if(!row)return;
  if(G.mode==='free'){
    if(G.startT===null)G.startT=t;
    if(!row.includes(f)){blameMissing(row);G.wrong++;G.pressed.clear();flash(l,'ng');shake();hud();return}
    if(G.pressed.size===0)G.firstAt=t;
    G.pressed.set(f,t);flash(l,'ok');
    if(row.every(n=>G.pressed.has(n))){
      if(G.lastT!==null)G.times.push(t-G.lastT);G.lastT=t;
      if(ac&&S.sound)tick(ac.currentTime,false,true);
      resolve();
    }
  }else{
    const target=G.t0+G.idx*G.iv,dt=t-target;
    if(dt<-G.win){G.err[f]++;G.early++;flash(l,'ng');return}
    if(!row.includes(f)){blameMissing(row);G.wrong++;flash(l,'ng');shake();return}
    G.pressed.set(f,t);flash(l,'ok');
    if(row.every(n=>G.pressed.has(n))){
      const ts=[...G.pressed.values()];
      const off=ts.reduce((a,b)=>a+b,0)/ts.length-target,spread=Math.max(...ts)-Math.min(...ts),a=Math.abs(off);
      const j=(a<=50&&spread<=60)?'p':(a<=110&&spread<=120)?'g':'z';
      G.judg[j]++;G.offs.push(off);judge(j,off);resolve();
    }
  }
}
function loop(now){
  if(!G)return;
  let p;
  if(G.mode==='tempo'){
    while(!G.done&&now>G.t0+G.idx*G.iv+G.win){
      blameMissing(G.rows[G.idx]);G.judg.m++;judge('m');shake();resolve();
    }
    p=(now-G.t0)/G.iv;
    $('#count').textContent=p<0?Math.ceil(-p):'';
  }else{
    if(!G.done&&G.pressed.size&&now-G.firstAt>PAIR_WIN){
      const row=G.rows[G.idx];row.forEach(n=>{if(!G.pressed.has(n))flash(5-n,'ng')});
      blameMissing(row);G.wrong++;G.pressed.clear();shake();hud();
    }
    G.pv+=(G.idx-G.pv)*0.3;if(Math.abs(G.idx-G.pv)<0.002)G.pv=G.idx;p=G.pv;
    $('#count').textContent='';
  }
  for(let i=0;i<G.els.length;i++){
    const d=i-p,el=G.els[i];
    if(d>4.5||d<-1.3){el.style.visibility='hidden';continue}
    el.style.visibility='visible';
    el.style.transform=`translateY(${G.hitY-d*G.rowH-G.cellH/2}px)`;
  }
  if(!G.done||G.mode==='tempo')raf=requestAnimationFrame(loop);
}

function finish(){
  if(!G)return;
  cancelAnimationFrame(raf);
  try{wl&&wl.release();wl=null}catch(e){}
  const need={5:0,4:0,3:0,2:0};G.rows.forEach(r=>r.forEach(f=>need[f]++));
  const cfg=G.cfg,n=G.rows.length,key=keyOf(cfg);
  const title=cfg.daily?`今日の練習（${mdOf(cfg.date)}）`:PATTERNS[cfg.pattern].name;
  let share='';
  const prev=data.best[key];
  let figs='',isBest=false,sub='';
  if(G.mode==='free'){
    const avg=G.times.length?Math.round(G.times.reduce((a,b)=>a+b,0)/G.times.length):0;
    const total=G.lastT&&G.startT!==null?((G.lastT-G.startT)/1000).toFixed(1):'0.0';
    const acc=Math.round(n/(n+G.wrong)*100);
    figs=`<div class="fig"><span>1マスあたり</span><b>${avg}</b><small>ms</small></div>
      <div class="fig"><span>正確さ</span><b>${acc}</b><small>%</small></div>
      <div class="fig"><span>押し間違い</span><b>${G.wrong}</b><small>回</small></div>`;
    if(acc>=90&&avg>0&&(!prev||avg<prev.avg)){data.best[key]={avg,acc};isBest=true}
    if(cfg.daily){const dl=data.daily||{};if(dl.last!==cfg.date){dl.streak=dl.last===today(-1)?(dl.streak||0)+1:1;dl.last=cfg.date}data.daily=dl}
    const st=cfg.daily&&data.daily.streak>1?`、連続${data.daily.streak}日`:'';
    share=`4本けんけんぱ！ ${title}${cfg.daily?'':`（${n}マス）`}\n1マスあたり ${avg}ms、正確さ ${acc}%${st}`;
    sub=acc<90?'正確さが90%未満の回は自己ベストに記録しません。':'';
  }else{
    const hits=G.offs.length;
    const rate=Math.round(G.judg.p/n*100);
    const mean=hits?Math.round(G.offs.reduce((a,b)=>a+b,0)/hits):0;
    figs=`<div class="fig"><span>ぴったり</span><b>${G.judg.p}</b><small>回 / ${n}</small></div>
      <div class="fig"><span>よい</span><b>${G.judg.g}</b><small>回</small></div>
      <div class="fig"><span>ずれ</span><b>${G.judg.z}</b><small>回</small></div>
      <div class="fig"><span>ミス</span><b>${G.judg.m}</b><small>回</small></div>
      <div class="fig"><span>平均のずれ</span><b>${Math.abs(mean)}</b><small>ms ${mean<0?'早め':mean>0?'遅め':''}</small></div>`;
    if(!prev||rate>prev.rate){data.best[key]={rate};isBest=true}
    share=`4本けんけんぱ！ ${title}（${cfg.bpm} BPM、${n}マス）\nぴったり ${G.judg.p}/${n}、ミス ${G.judg.m}`;
    sub='';
  }
  share+=`\n#4本けんけんぱ${SITE_URL?'\n'+SITE_URL:''}`;
  save(data);
  const rates=FINGERS.map(f=>({f,e:G.err[f],need:need[f],r:need[f]?G.err[f]/need[f]:0}));
  const maxR=Math.max(0.0001,...rates.map(x=>x.r));
  const worst=rates.filter(x=>x.need).sort((a,b)=>b.r-a.r)[0];
  const bars=rates.map(x=>`<div class="bar" style="--c:var(--f${x.f})"><span>${x.f}（${NAME[x.f]}）</span><div class="track"><div class="fill" style="width:${x.need?Math.round(x.r/maxR*100):0}%"></div></div><span class="v">${x.need?`${x.e} / ${x.need}回`:'出番なし'}</span></div>`).join('');
  const note=worst&&worst.e>0?`ミスの割合がいちばん高かったのは <b>${worst.f}（${NAME[worst.f]}）</b> です。`:'どの指もミスなしでした。';
  $('#res').innerHTML=`
    <div><h2>${isBest?'自己ベスト更新':'おつかれさまでした'}</h2><p class="sub">${title}、${n}マス、${G.mode==='tempo'?S.bpm+' BPM':'自分のペース'}</p></div>
    <div class="figs">${figs}</div>
    <div><p class="label">指ごとのミス</p><div class="bars">${bars}</div></div>
    <p class="note">${note}${sub?' '+sub:''}</p>
    <div><p class="label">結果をシェア</p><textarea class="share-text" id="share-text" rows="3" readonly>${share}</textarea>
      <div class="share"><a class="sh" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(share)}" target="_blank" rel="noopener">Xに投稿</a><a class="sh" href="https://bsky.app/intent/compose?text=${encodeURIComponent(share)}" target="_blank" rel="noopener">Blueskyに投稿</a><button class="sh" id="copy">コピー</button></div></div>
    <div class="btns"><button class="primary" id="again">もう一度</button><button id="back">メニューへ</button></div>`;
  $('#again').onclick=()=>start(cfg.daily);
  $('#copy').onclick=()=>{const b=$('#copy'),ta=$('#share-text');const done=()=>{b.textContent='コピーしました';setTimeout(()=>b.textContent='コピー',1500)};const fb=()=>{ta.focus();ta.select();b.textContent='選択したのでコピーしてください'};try{navigator.clipboard.writeText(ta.value).then(done,fb)}catch(e){fb()}};
  $('#back').onclick=()=>{show('menu');syncMenu()};
  G=null;show('result');
}
$('#start').addEventListener('click',()=>start(false));
$('#daily-start').addEventListener('click',()=>start(true));
$('#quit').addEventListener('click',()=>{cancelAnimationFrame(raf);G=null;try{wl&&wl.release();wl=null}catch(e){}show('menu');syncMenu()});
})();
</script>

</body>
</html>
